<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512" role="img" aria-label="Film Beyond Imagination">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a3"/>
      <stop offset="0.28" stop-color="#f6c84b"/>
      <stop offset="0.58" stop-color="#c98b1f"/>
      <stop offset="0.8" stop-color="#f3c64a"/>
      <stop offset="1" stop-color="#fff0a3"/>
    </linearGradient>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="9" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a">
        <feFuncA type="table" tableValues="0 .12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="a" mode="overlay"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="72" fill="#0a0d12"/>
  <rect x="10" y="10" width="492" height="492" rx="66" fill="#11151d" opacity=".78"/>
  <rect x="10" y="10" width="492" height="492" rx="66" fill="#5f6470" opacity=".22" filter="url(#noise)"/>

  <g transform="" filter="url(#shadow)">
    <!-- stylized camera-aperture mark based on the supplied FBI logo -->
    <g transform="translate(154 228)">
      <g fill="url(#gold)">
        <path d="M-20-96 C3-113 36-121 67-116 L48-78 C29-84 8-81-9-70 Z"/>
        <path d="M68-116 C99-110 126-93 143-69 L101-65 C92-80 77-91 60-98 Z"/>
        <path d="M143-69 C159-43 165-12 160 18 L123-5 C127-23 123-42 114-57 Z"/>
        <path d="M160 18 C153 48 137 74 114 92 L97 53 C111 43 121 28 126 12 Z"/>
        <path d="M114 92 C89 109 60 117 29 112 L49 74 C67 79 86 76 102 68 Z"/>
        <path d="M29 112 C-2 106-28 91-47 68 L-5 64 C4 79 20 90 36 97 Z"/>
        <path d="M-47 68 C-63 43-69 14-64-16 L-26 7 C-30 25-26 43-17 57 Z"/>
        <path d="M-64-16 C-58-47-43-73-19-91 L-3-52 C-18-42-28-27-33-10 Z"/>
      </g>
      <circle cx="48" cy="-2" r="44" fill="#10141b"/>
      <circle cx="48" cy="-2" r="47" fill="none" stroke="#f2c54a" stroke-opacity=".22" stroke-width="2"/>
    </g>

    <text x="330" y="266" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif" font-size="137" font-weight="900"
      letter-spacing="-6" fill="url(#gold)">FBI</text>

    <text x="330" y="322" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"
      letter-spacing="3.2" fill="#f2d27a">FILM BEYOND</text>
    <text x="330" y="350" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"
      letter-spacing="3.2" fill="#f2d27a">IMAGINATION</text>
  </g>
</svg>