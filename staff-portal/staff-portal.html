<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FBI Invoice Portal</title>
<style>body{margin:0;background:#080a0e;color:#f5f6f8;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#11151c;border:1px solid #27303b;border-radius:14px;padding:18px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:55px;height:55px;object-fit:contain;background:#fff;border-radius:8px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin:9px 0}.field label{display:block;color:#9099a8;font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border-radius:8px;border:1px solid #27303b;background:#090c11;color:#fff;box-sizing:border-box}.btn{padding:10px 14px;border-radius:8px;border:1px solid #27303b;background:#181e27;color:#fff}.primary{background:#d4af37;color:#08090b;border-color:#d4af37;font-weight:bold}.login{min-height:100vh;display:grid;place-items:center}.login .card{width:min(420px,92vw)}.hidden{display:none}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:7px;align-items:end}.summary{display:flex;justify-content:space-between;border-top:1px solid #27303b;padding:10px 0}.scroll{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #27303b;text-align:left;font-size:12px}.actions{display:flex;gap:5px;flex-wrap:wrap}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body>
<div id="login" class="login"><div class="card"><div class="brand"><img src="/assets/fbi-logo.jpg"><div><h2 style="margin:0">FBI Invoice Portal</h2><small>Staff invoicing and receipts</small></div></div><div id="sign"><div class="field"><label>Username</label><input id="lu"></div><div class="field"><label>Password</label><input id="lp" type="password"></div><button class="btn primary" style="width:100%" onclick="login()">Sign In</button><p><button class="btn" onclick="regMode()">Create Staff Account</button></p></div><div id="reg" class="hidden"><div class="field"><label>Full Name</label><input id="rn"></div><div class="field"><label>Username</label><input id="ru"></div><div class="field"><label>Password</label><input id="rp" type="password"></div><button class="btn primary" style="width:100%" onclick="register()">Create Account</button><p><button class="btn" onclick="loginMode()">Back</button></p></div><div id="msg"></div></div></div>
<div id="app" class="hidden"><div class="wrap"><div class="top"><div class="brand"><img src="/assets/fbi-logo.jpg"><div><b>FBI Invoice Portal</b><small id="who"></small></div></div></div><div class="grid"><div class="card"><h3>Dashboard</h3><div class="summary"><span>Invoices</span><b id="count">0</b></div><div class="summary"><span>Invoiced</span><b id="rev">GHS 0.00</b></div><div class="summary"><span>Payments</span><b id="paid">GHS 0.00</b></div></div>
<div class="card"><h3>Create Invoice</h3><div class="field"><label>Existing Client</label><select id="client" onchange="pick()"><option value="">New client</option></select></div><div class="field"><label>Client Name</label><input id="cn"></div><div class="field"><label>Phone</label><input id="cp"></div><div class="field"><label>Email</label><input id="ce"></div><div id="items"></div><button class="btn" onclick="item()">+ Add Item</button><div class="summary"><span>Total</span><b id="total">GHS 0.00</b></div><button class="btn primary" onclick="createInvoice()">Generate Invoice</button><div id="im"></div></div></div>
<div class="card"><h3>Invoices & Receipts</h3><div class="scroll"><table class="table"><thead><tr><th>Invoice</th><th>Client</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div>
<script>var S={clients:[],invoices:[]};function $(x){return document.getElementById(x)}function esc(v){return String(v||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function api(u,o){o=o||{};o.headers={'Content-Type':'application/json'};return fetch(u,o).then(function(r){return r.json().then(function(b){if(!r.ok)throw Error(b.error||'Request failed');return b})})}function regMode(){$('sign').classList.add('hidden');$('reg').classList.remove('hidden')}function loginMode(){$('reg').classList.add('hidden');$('sign').classList.remove('hidden')}function login(){api('/api/portal/login',{method:'POST',body:JSON.stringify({username:$('lu').value,password:$('lp').value})}).then(load).catch(function(e){$('msg').textContent=e.message})}function register(){api('/api/portal/register',{method:'POST',body:JSON.stringify({name:$('rn').value,username:$('ru').value,password:$('rp').value})}).then(load).catch(function(e){$('msg').textContent=e.message})}function load(){return api('/api/portal/data').then(function(b){S=b;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Signed in as '+b.user.display_name;clients();item();render()})}function clients(){$('client').innerHTML='<option value="">New client</option>'+S.clients.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'}).join('')}function pick(){var c=S.clients.find(function(x){return String(x.id)===$('client').value});if(c){$('cn').value=c.name||'';$('cp').value=c.phone||'';$('ce').value=c.email||''}}function item(){var d=document.createElement('div');d.className='row';d.innerHTML='<div class="field"><label>Description</label><input class="desc"></div><div class="field"><label>Qty</label><input class="qty" type="number" value="1"></div><div class="field"><label>Days</label><input class="days" type="number" value="1"></div><div class="field"><label>Rate</label><input class="rate" type="number" step="0.01"></div><button class="btn" onclick="this.parentNode.remove();calc()">×</button>';d.querySelectorAll('input').forEach(function(x){x.oninput=calc});$('items').appendChild(d)}function calc(){var t=0;document.querySelectorAll('#items .row').forEach(function(r){t+=(+r.querySelector('.qty').value||0)*(+r.querySelector('.days').value||1)*(+r.querySelector('.rate').value||0)});$('total').textContent='GHS '+t.toFixed(2)}function createInvoice(){var a=[].slice.call(document.querySelectorAll('#items .row')).map(function(r){return {desc:r.querySelector('.desc').value,qty:r.querySelector('.qty').value,days:r.querySelector('.days').value,rate:r.querySelector('.rate').value}});api('/api/portal/invoices',{method:'POST',body:JSON.stringify({clientId:$('client').value,clientName:$('cn').value,phone:$('cp').value,email:$('ce').value,items:a})}).then(function(b){$('im').textContent=b.invoice.no+' created successfully.';return api('/api/portal/data')}).then(function(b){S=b;clients();render()}).catch(function(e){$('im').textContent=e.message})}function paid(i){return(i.payments||[]).reduce(function(a,p){return a+(+p.amount||0)},0)}function render(){var a=S.invoices||[];$('count').textContent=a.length;$('rev').textContent='GHS '+a.reduce(function(x,i){return x+(+i.total||0)},0).toFixed(2);$('paid').textContent='GHS '+a.reduce(function(x,i){return x+paid(i)},0).toFixed(2);$('rows').innerHTML=a.slice(0,100).map(function(i){var p=paid(i),b=(+i.total||0)-p;return '<tr><td><b>'+esc(i.no)+'</b></td><td>'+esc(i.client)+'</td><td>GHS '+(+i.total||0).toFixed(2)+'</td><td>GHS '+p.toFixed(2)+'</td><td>GHS '+b.toFixed(2)+'</td><td>'+esc(i.status)+'</td><td><button class="btn" onclick="invoice(\''+esc(i.id)+'\')">Invoice</button>'+(b>0?'<button class="btn" onclick="payment(\''+esc(i.id)+'\')">Payment</button>':'')+(p>0?'<button class="btn" onclick="receipt(\''+esc(i.id)+'\')">Receipt</button>':'')+'</td></tr>'}).join('')}function invoice(id){var i=S.invoices.find(function(x){return String(x.id)===String(id)});var w=window.open('','_blank');w.document.write('<h1>INVOICE '+esc(i.no)+'</h1><p>Client: '+esc(i.client)+'</p><table border="1" cellpadding="8"><tr><th>Description</th><th>Qty</th><th>Days</th><th>Rate</th><th>Amount</th></tr>'+(i.items||[]).map(function(x){return '<tr><td>'+esc(x.desc)+'</td><td>'+x.qty+'</td><td>'+x.days+'</td><td>GHS '+(+x.rate).toFixed(2)+'</td><td>GHS '+(+x.total).toFixed(2)+'</td></tr>'}).join('')+'</table><h2>Total: GHS '+(+i.total).toFixed(2)+'</h2>');w.document.close();w.print()}function payment(id){var a=prompt('Payment amount');if(a===null)return;api('/api/portal/payments',{method:'POST',body:JSON.stringify({invoiceId:id,amount:+a,method:prompt('Payment method','Mobile Money')||'Payment',reference:prompt('Reference','')||''})}).then(function(){return api('/api/portal/data')}).then(function(b){S=b;clients();render()}).catch(function(e){alert(e.message)})}function receipt(id){var i=S.invoices.find(function(x){return String(x.id)===String(id)}),p=(i.payments||[])[(i.payments||[]).length-1];if(!p)return;var w=window.open('','_blank');w.document.write('<h1>OFFICIAL RECEIPT</h1><h2>'+esc(p.receiptNo)+'</h2><p>Invoice: '+esc(i.no)+'</p><p>Received from: '+esc(i.client)+'</p><h2>Amount: GHS '+(+p.amount).toFixed(2)+'</h2><p>Method: '+esc(p.method)+'</p><p>Balance: GHS '+(+p.balanceAfter).toFixed(2)+'</p><p>Received by: '+esc(p.receivedBy)+'</p>');w.document.close();w.print()}api('/api/portal/data').then(function(b){S=b;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Signed in as '+b.user.display_name;clients();item();render()}).catch(function(){});</script></body></html>
