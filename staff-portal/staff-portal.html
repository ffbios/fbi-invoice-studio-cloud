<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FBI Staff Portal</title>
<style>
:root{--gold:#d4af37;--bg:#080a0e;--panel:#11151c;--line:#29313c;--text:#f5f6f8;--muted:#929baa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.field{margin:11px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:#090c11;color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:end}.btn{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#181e27;color:#fff;cursor:pointer}.primary{background:var(--gold);border-color:var(--gold);color:#07080a;font-weight:800}
.login{min-height:100vh;display:grid;place-items:center}.login .card{width:min(420px,92vw)}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab.active{background:var(--gold);color:#07080a;border-color:var(--gold);font-weight:800}.msg{margin-top:10px;font-size:12px}.ok{color:#7fe0a5}.err{color:#ff8f8f}.result{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px;background:#0c1016}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.big{font-size:22px;font-weight:800}
@media(max-width:750px){.grid,.row{grid-template-columns:1fr}.wrap{padding:12px}}
@media print{body{background:#fff;color:#000}.no-print{display:none!important}.print-page{display:block!important;max-width:800px;margin:auto;color:#000}.print-page table{width:100%;border-collapse:collapse}.print-page th,.print-page td{border:1px solid #ccc;padding:8px}.print-page .total{font-size:20px;font-weight:800;text-align:right}}
</style></head><body>
<div id="login" class="login"><div class="card"><div class="brand"><img src="/assets/fbi-logo.jpg"><div><h2 style="margin:0">FBI Staff Portal</h2><small>Create invoices and receipts</small></div></div>
<div id="signInBox"><div class="field"><label>Username</label><input id="lu" autocomplete="username"></div><div class="field"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%" onclick="login()">Sign In</button><p><button class="btn" onclick="showRegister()">Create Staff Account</button></p></div>
<div id="registerBox" class="hidden"><div class="field"><label>Full Name</label><input id="rn"></div><div class="field"><label>Username</label><input id="ru" autocomplete="username"></div><div class="field"><label>Password</label><input id="rp" type="password" autocomplete="new-password"></div><button class="btn primary" style="width:100%" onclick="register()">Create Account</button><p><button class="btn" onclick="showLogin()">Back to Sign In</button></p></div>
<div id="loginMsg" class="msg err"></div></div></div>
<div id="app" class="hidden"><div class="wrap"><div class="top"><div class="brand"><img src="/assets/fbi-logo.jpg"><div><b>FBI Staff Portal</b><small id="who"></small></div></div><button class="btn" onclick="logout()">Sign Out</button></div>
<div class="tabs"><button id="invoiceTab" class="btn tab active" onclick="showTab('invoice')">Create Invoice</button><button id="receiptTab" class="btn tab" onclick="showTab('receipt')">Create Receipt</button></div>
<section id="invoicePanel" class="card"><h3>Create Invoice</h3><div class="field"><label>Existing Client</label><select id="clientSelect" onchange="selectClient()"><option value="">New Client</option></select></div><div class="grid"><div class="field"><label>Client Name</label><input id="clientName"></div><div class="field"><label>Phone Number</label><input id="clientPhone"></div><div class="field"><label>Email</label><input id="clientEmail"></div><div class="field"><label>Invoice Date</label><input id="invoiceDate" type="date"></div><div class="field"><label>Due</label><input id="invoiceDue" value="On Receipt"></div><div class="field"><label>Currency</label><input id="invoiceCurrency" value="GHS"></div><div class="field"><label>Discount</label><input id="invoiceDiscount" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Tax</label><input id="invoiceTax" type="number" min="0" step="0.01" value="0"></div></div><div class="card" style="margin-top:12px"><h4>Service Catalog</h4><div class="grid"><div class="field"><label>Service Category</label><select id="serviceCategory" onchange="catalogCategory()"></select></div><div class="field"><label>Brand / Model</label><select id="brandModelFilter" onchange="catalogRefresh()"></select></div><div class="field"><label>Search Item</label><input id="itemSearch" oninput="catalogRefresh()" placeholder="Search catalog item"></div><div class="field"><label>Select Item</label><select id="catalogItemSelect" size="5" ondblclick="addSelectedCatalogItem()"></select></div></div><div class="actions"><button class="btn primary" onclick="addSelectedCatalogItem()">+ Add Selected Item</button><button class="btn" onclick="addCatalogItems()">+ Add Group Items</button></div><small id="catalogCount"></small></div><div class="card" style="margin-top:12px"><h4>Invoice Items</h4><div id="items"></div><button class="btn" onclick="addItem()">+ Add Item</button></div><div class="grid"><div class="field"><label>Event Start</label><input id="eventDate" type="date"></div><div class="field"><label>Event End</label><input id="eventEndDate" type="date"></div><div class="field"><label>Job Location</label><input id="jobLocation"></div><div class="field"><label>Rental Unit</label><select id="rentalUnit"><option>Per Day</option><option>Per Event</option><option>Per Hour</option></select></div><div class="field" style="grid-column:1/-1"><label>Notes</label><textarea id="invoiceNotes" rows="3"></textarea></div></div><div class="result"><div style="display:flex;justify-content:space-between"><span>Total</span><b id="invoiceTotal" class="big">GHS 0.00</b></div></div><div class="actions"><button class="btn primary" onclick="createInvoice()">Generate Invoice</button><button class="btn" onclick="clearInvoice()">Clear</button></div><div id="invoiceMsg" class="msg"></div><div id="invoiceResult"></div></section>
<section id="receiptPanel" class="card hidden"><h3>Create Receipt</h3><div class="field"><label>Invoice Number</label><input id="receiptInvoiceNo" placeholder="INV0001"></div><div class="actions"><button class="btn" onclick="findInvoice()">Find Invoice</button></div><div id="invoiceFound"></div><div id="paymentBox" class="hidden"><div class="grid"><div class="field"><label>Amount Received</label><input id="paymentAmount" type="number" min="0" step="0.01"></div><div class="field"><label>Payment Method</label><select id="paymentMethod"><option>Mobile Money</option><option>Bank Transfer</option><option>Cash</option><option>Card</option><option>Other</option></select></div><div class="field"><label>Transaction Reference</label><input id="paymentReference"></div><div class="field"><label>Payment Date</label><input id="paymentDate" type="date"></div></div><button class="btn primary" onclick="createReceipt()">Generate Receipt</button><div id="receiptMsg" class="msg"></div><div id="receiptResult"></div></div></section>
</div></div><div id="printArea" class="hidden"></div>
<script src="/invoice-catalog.js"></script><script>
var currentInvoice=null;function $(x){return document.getElementById(x)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function api(u,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json'},o.headers||{});return fetch(u,o).then(function(r){return r.json().then(function(b){if(!r.ok)throw Error(b.error||'Request failed');return b})})}
function showLogin(){$('registerBox').classList.add('hidden');$('signInBox').classList.remove('hidden');$('loginMsg').textContent=''}function showRegister(){$('signInBox').classList.add('hidden');$('registerBox').classList.remove('hidden');$('loginMsg').textContent=''}
function login(){api('/api/portal/login',{method:'POST',body:JSON.stringify({username:$('lu').value,password:$('lp').value})}).then(start).catch(function(e){$('loginMsg').textContent=e.message})}
function register(){api('/api/portal/register',{method:'POST',body:JSON.stringify({name:$('rn').value,username:$('ru').value,password:$('rp').value})}).then(start).catch(function(e){$('loginMsg').textContent=e.message})}
async function start(b){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Signed in as '+b.user.display_name;showTab('invoice');try{var d=await api('/api/portal/catalog');if(d&&d.catalog){CATEGORIES=d.categories||CATEGORIES;CATALOG=d.catalog||CATALOG}}catch(e){}initCatalog();addItem();$('invoiceDate').value=new Date().toISOString().slice(0,10);$('paymentDate').value=new Date().toISOString().slice(0,10);api('/api/portal/data').then(function(d){$('clientSelect').innerHTML='<option value="">New Client</option>'+(d.clients||[]).map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'}).join('')}).catch(function(){})}
function logout(){api('/api/portal/logout',{method:'POST'}).then(function(){location.reload()})}
function initCatalog(){var cats=window.CATEGORIES||[];$('serviceCategory').innerHTML=cats.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');catalogCategory()}
function catalogCategory(){var c=$('serviceCategory').value,arr=(window.SERVICE_CATALOG&&SERVICE_CATALOG[c])||[];var brands=[];arr.forEach(function(x){var u=String(x).toUpperCase(),p=['SONY','CANON','BLACKMAGIC','PANASONIC','FUJIFILM','NIKON','RED','ARRI','DJI','SIGMA','TAMRON','APUTURE','GODOX','ASTERA','NANLITE','SENNHEISER','SHURE','RODE','ZOOM','TASCAM','HOLLYLAND','ATOMOS','TERADEK','DATAVIDEO','EPSON','BENQ','OPTOMA','MANFROTTO','SACHTLER','MILLER','AVENGER','KUPO','ZHIYUN','GOOGLE MEET','TEAMS'].find(function(p){return u===p||u.indexOf(p+' ')===0||u.indexOf(p+'-')===0});if(p&&brands.indexOf(p)<0)brands.push(p)});$('brandModelFilter').innerHTML='<option value="">All Brands / Models</option>'+brands.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');$('itemSearch').value='';catalogRefresh()}
function catalogRefresh(){var c=$('serviceCategory').value,b=$('brandModelFilter').value,q=$('itemSearch').value.toLowerCase(),arr=((window.SERVICE_CATALOG&&SERVICE_CATALOG[c])||[]).slice();if(b){var bu=b.toLowerCase();arr=arr.filter(function(x){var y=String(x).toLowerCase();return y===bu||y.indexOf(bu+' ')===0||y.indexOf(bu+'-')===0})}if(q)arr=arr.filter(function(x){return String(x).toLowerCase().indexOf(q)>=0});$('catalogItemSelect').innerHTML=arr.length?arr.map(function(x){return '<option value="'+esc(x)+'">'+esc(x)+'</option>'}).join(''):'<option value="">No matching items</option>';$('catalogCount').textContent=arr.length+' available items'}
function addSelectedCatalogItem(){var n=$('catalogItemSelect').value;if(n)addItem(n,1,0,1)}
function addCatalogItems(){var opts=[].slice.call($('catalogItemSelect').options).slice(0,25);opts.forEach(function(o){if(o.value)addItem(o.value,1,0,1)})}
function showTab(t){$('invoicePanel').classList.toggle('hidden',t!=='invoice');$('receiptPanel').classList.toggle('hidden',t!=='receipt');$('invoiceTab').classList.toggle('active',t==='invoice');$('receiptTab').classList.toggle('active',t==='receipt')}
function addItem(){var d=document.createElement('div');d.className='row';d.innerHTML='<div class="field"><label>Description</label><input class="desc"></div><div class="field"><label>Qty</label><input class="qty" type="number" min="1" value="1"></div><div class="field"><label>Days</label><input class="days" type="number" min="1" value="1"></div><div class="field"><label>Rate</label><input class="rate" type="number" min="0" step="0.01"></div><button class="btn" onclick="this.parentNode.remove();calc()">×</button>';d.querySelectorAll('input').forEach(function(x){x.oninput=calc});$('items').appendChild(d)}
function calc(){var t=0;document.querySelectorAll('#items .row').forEach(function(r){t+=(+r.querySelector('.qty').value||0)*(+r.querySelector('.days').value||1)*(+r.querySelector('.rate').value||0)});$('invoiceTotal').textContent='GHS '+t.toFixed(2);return t}
function clearInvoice(){$('items').innerHTML='';$('clientSelect').value='';$('clientName').value='';$('clientPhone').value='';$('clientEmail').value='';$('invoiceMsg').textContent='';$('invoiceResult').innerHTML='';addItem();calc()}
function downloadPdf(url,done){return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)return r.json().catch(function(){return {error:'PDF request failed.'}}).then(function(b){throw Error(b.error||'Could not create PDF.')});return r.blob()}).then(function(blob){var a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);if(done)done()})}
function downloadInvoicePdf(no){return downloadPdf('/api/portal/invoice-pdf?no='+encodeURIComponent(no))}
function downloadReceiptPdf(invoiceNo,receiptNo){return downloadPdf('/api/portal/receipt-pdf?invoice='+encodeURIComponent(invoiceNo)+'&receipt='+encodeURIComponent(receiptNo))}
function createInvoice(){var items=[].slice.call(document.querySelectorAll('#items .row')).map(function(r){return {desc:r.querySelector('.desc').value,qty:+r.querySelector('.qty').value||0,days:+r.querySelector('.days').value||1,rate:+r.querySelector('.rate').value||0}});api('/api/portal/invoices',{method:'POST',body:JSON.stringify({clientId:$('clientSelect').value,clientName:$('clientName').value,phone:$('clientPhone').value,email:$('clientEmail').value,date:$('invoiceDate').value,due:$('invoiceDue').value,cur:$('invoiceCurrency').value,discount:+$('invoiceDiscount').value||0,tax:+$('invoiceTax').value||0,notes:$('invoiceNotes').value,eventDate:$('eventDate').value,eventEndDate:$('eventEndDate').value,jobLocation:$('jobLocation').value,rentalUnit:$('rentalUnit').value,items:items})}).then(function(b){currentInvoice=b.invoice;$('invoiceMsg').className='msg ok';$('invoiceMsg').textContent='Invoice '+b.invoice.no+' saved to the central system. PDF download started.';$('receiptInvoiceNo').value=b.invoice.no;$('invoiceResult').innerHTML='<div class="result"><b>Invoice '+esc(b.invoice.no)+'</b><div style="margin-top:6px">Client: '+esc(b.invoice.client)+'</div><div>Total: '+esc(b.invoice.cur||'GHS')+' '+(+b.invoice.total).toFixed(2)+'</div><div class="actions"><button class="btn primary" onclick="downloadInvoicePdf(currentInvoice.no)">Download Invoice PDF</button><button class="btn" onclick="printInvoice(currentInvoice)">Print Invoice</button><button class="btn" onclick="showTab(\'receipt\');findInvoice()">Record Payment / Receipt</button></div></div>';downloadInvoicePdf(b.invoice.no).catch(function(e){$('invoiceMsg').textContent='Invoice '+b.invoice.no+' saved to the central system, but the PDF could not be downloaded: '+e.message;$('invoiceMsg').className='msg err'})}).catch(function(e){$('invoiceMsg').className='msg err';$('invoiceMsg').textContent=e.message})}
function findInvoice(){var no=$('receiptInvoiceNo').value.trim();if(!no)return;api('/api/portal/invoice?no='+encodeURIComponent(no)).then(function(b){currentInvoice=b.invoice;$('invoiceFound').innerHTML='<div class="result"><b>'+esc(b.invoice.no)+'</b><div>'+esc(b.invoice.client)+'</div><div>Total: GHS '+(+b.invoice.total).toFixed(2)+'</div><div>Paid: GHS '+(+b.invoice.paid).toFixed(2)+'</div><div>Balance: GHS '+(+b.invoice.balance).toFixed(2)+'</div></div>';$('paymentBox').classList.remove('hidden');$('paymentAmount').max=b.invoice.balance;$('receiptMsg').textContent=''}).catch(function(e){currentInvoice=null;$('invoiceFound').innerHTML='';$('paymentBox').classList.add('hidden');$('receiptMsg').className='msg err';$('receiptMsg').textContent=e.message})}
function createReceipt(){if(!currentInvoice)return;var amt=+$('paymentAmount').value||0;api('/api/portal/payments',{method:'POST',body:JSON.stringify({invoiceNo:currentInvoice.no,amount:amt,method:$('paymentMethod').value,reference:$('paymentReference').value,date:$('paymentDate').value})}).then(function(b){$('receiptMsg').className='msg ok';$('receiptMsg').textContent='Receipt '+b.payment.receiptNo+' saved to the central system. PDF download started.';$('receiptResult').innerHTML='<div class="result"><b>Receipt '+esc(b.payment.receiptNo)+'</b><div>Invoice: '+esc(b.invoice.no)+'</div><div>Amount: '+esc(b.invoice.cur||'GHS')+' '+(+b.payment.amount).toFixed(2)+'</div><div class="actions"><button class="btn primary" onclick="downloadReceiptPdf(currentInvoice.no,\''+esc(b.payment.receiptNo)+'\')">Download Receipt PDF</button><button class="btn" onclick="printReceipt({invoice:currentInvoice,payment:'+JSON.stringify(b.payment).replace(/</g,'\\u003c')+'})">Print Receipt</button></div></div>';downloadReceiptPdf(b.invoice.no,b.payment.receiptNo).catch(function(e){$('receiptMsg').textContent='Receipt '+b.payment.receiptNo+' saved to the central system, but the PDF could not be downloaded: '+e.message;$('receiptMsg').className='msg err'})}).catch(function(e){$('receiptMsg').className='msg err';$('receiptMsg').textContent=e.message})}
function printInvoice(i){var rows=(i.items||[]).map(function(x){return '<tr><td>'+esc(x.desc)+'</td><td>'+x.qty+'</td><td>'+x.days+'</td><td>GHS '+(+x.rate).toFixed(2)+'</td><td>GHS '+(+x.total).toFixed(2)+'</td></tr>'}).join('');$('printArea').innerHTML='<div class="print-page"><img src="/assets/fbi-logo.jpg" style="width:110px"><h1>INVOICE</h1><h2>'+esc(i.no)+'</h2><p><b>Bill To:</b> '+esc(i.client)+'<br>'+esc(i.clientPhone||'')+'<br>'+esc(i.clientEmail||'')+'</p><table><tr><th>Description</th><th>Qty</th><th>Days</th><th>Rate</th><th>Amount</th></tr>'+rows+'</table><p class="total">TOTAL: GHS '+(+i.total).toFixed(2)+'</p><p>Created by: '+esc(i.createdByName||i.createdBy||'')+'</p></div>';$('app').classList.add('no-print');$('printArea').classList.remove('hidden');window.print();setTimeout(function(){$('printArea').classList.add('hidden');$('app').classList.remove('no-print')},300)}
function printReceipt(x){var i=x.invoice,p=x.payment;$('printArea').innerHTML='<div class="print-page"><img src="/assets/fbi-logo.jpg" style="width:110px"><h1>OFFICIAL RECEIPT</h1><h2>'+esc(p.receiptNo)+'</h2><p><b>Invoice:</b> '+esc(i.no)+'<br><b>Received from:</b> '+esc(i.client)+'<br><b>Amount:</b> GHS '+(+p.amount).toFixed(2)+'<br><b>Method:</b> '+esc(p.method)+'<br><b>Reference:</b> '+esc(p.transactionRef||'')+'<br><b>Date:</b> '+esc(p.date||'')+'<br><b>Balance after payment:</b> GHS '+(+p.balanceAfter).toFixed(2)+'</p><p>Received by: '+esc(p.recordedByName||p.receivedBy||'')+'</p></div>';$('app').classList.add('no-print');$('printArea').classList.remove('hidden');window.print();setTimeout(function(){$('printArea').classList.add('hidden');$('app').classList.remove('no-print')},300)}
api('/api/portal/me').then(start).catch(function(){})
</script></body></html>
