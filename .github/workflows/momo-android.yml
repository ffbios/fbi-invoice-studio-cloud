name: Build FBI MoMo Link APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'momo-android/**'
      - '.github/workflows/momo-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Use the FBI signing key when it is configured
        env:
          KS: ${{ secrets.MOMO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > momo-android/app/momo-link.keystore; echo "Signing with FBI key"; else echo "No FBI key configured; using the build key"; fi
      - name: Build APK
        working-directory: momo-android
        env:
          MOMO_KEYSTORE_PASSWORD: ${{ secrets.MOMO_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: fbi-momo-link-apk
          path: momo-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
