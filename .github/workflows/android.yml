name: Build FBI SMS Gateway APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'sms-android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: sms-android
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fbi-sms-gateway-apk-v4
          path: sms-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fbi-sms-gateway-v4
          name: FBI SMS Gateway v4
          prerelease: true
          make_latest: false
          files: sms-android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            FBI SMS Gateway Android installer.
            Improved permission guidance and redesigned mobile UI.
            Secure paired-device authentication.
            Includes Railway-domain fallback for reliable pairing when the custom domain DNS is unavailable.
