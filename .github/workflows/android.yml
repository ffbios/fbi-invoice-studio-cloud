name: Build FBI SMS Gateway APK
# Pairing v9 verification pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'sms-android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: sms-android
        run: gradle assembleDebug --stacktrace
      - name: Verify pairing endpoint is reachable
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            code=$(curl -sS --connect-timeout 15 --max-time 30 \
              -o /tmp/pair-response.txt \
              -w "%{http_code}" \
              "https://invoice.fbigh.com/sms-gateway-pair" \
              -H "X-FBI-Pair-Code: 000000" \
              -H "X-FBI-Gateway-Id: ci-smoke-gateway" \
              -H "X-FBI-Gateway-Name: CI Smoke Test" \
              -H "User-Agent: FBI-SMS-Gateway-CI/9" \
              -H "Accept: application/json")
            echo "pairing smoke HTTP $code"
            cat /tmp/pair-response.txt || true
            # 401 proves the request reached the application and the test code
            # is simply invalid. 429 means the edge rate-limit is still in play.
            if [ "$code" = "401" ] || [ "$code" = "400" ]; then
              exit 0
            fi
            if [ "$code" = "429" ] || [ "$code" = "000" ]; then
              sleep 10
              continue
            fi
            echo "Unexpected pairing response: HTTP $code"
            exit 1
          done
          echo "Pairing endpoint is still returning 429/unreachable."
          exit 1
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: fbi-sms-gateway-apk-v9
          path: sms-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fbi-sms-gateway-v9
          name: FBI SMS Gateway v9
          prerelease: true
          make_latest: false
          files: sms-android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            FBI SMS Gateway Android installer.
            Improved permission guidance and redesigned mobile UI.
            Secure paired-device authentication.
            Pairing uses GET with private headers to avoid the Railway edge POST rate-limit path.
