name: Build FBI SMS Gateway APK
# Pairing v12 verification pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'sms-android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: sms-android
        run: gradle assembleDebug --stacktrace
      - name: Verify pairing endpoint from GitHub runner
        run: |
          set -euo pipefail
          endpoints=(
            "http://thomas.proxy.rlwy.net:27251/api/sms/gateway/pair-bootstrap"
            "https://fbi-invoice-studio-production.up.railway.app/api/sms/gateway/pair-exchange?exchangeId=none&secret=x"
            "https://fbi-invoice-studio-production.up.railway.app/api/sms/gateway/pair-v2"
            "https://fbi-invoice-studio-production.up.railway.app/sms-gateway-pair"
            "https://invoice.fbigh.com/sms-gateway-pair"
          )
          for endpoint in "${endpoints[@]}"; do
            echo "Testing pairing endpoint: $endpoint"
            code=$(curl -sS --connect-timeout 15 --max-time 30               -o /tmp/pair-response.txt               -w "%{http_code}"               "$endpoint"               -H "X-FBI-Pair-Code: 000000"               -H "X-FBI-Gateway-Id: ci-smoke-gateway"               -H "X-FBI-Gateway-Name: CI Smoke Test"               -H "User-Agent: FBI-SMS-Gateway-CI/12"               -H "Accept: application/json")
            echo "HTTP $code"
            cat /tmp/pair-response.txt || true
            if [ "$code" = "401" ] || [ "$code" = "400" ]; then
              echo "Application reached successfully through $endpoint"
              exit 0
            fi
          done
          echo "No pairing endpoint reached the application without an edge 429/unreachable response."
          exit 1
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: fbi-sms-gateway-apk-v12
          path: sms-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fbi-sms-gateway-v12
          name: FBI SMS Gateway v12
          prerelease: true
          make_latest: false
          files: sms-android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            FBI SMS Gateway Android installer v10.
            Pairing now tests the Railway-generated service domain as well as the custom domain.
            The Android client uses the same endpoint fallback strategy.
